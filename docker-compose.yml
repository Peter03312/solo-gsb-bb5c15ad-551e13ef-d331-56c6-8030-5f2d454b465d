services:
  web:
    build: .
    image: evacuation-audit:latest
    container_name: evacuation-audit
    ports:
      - "${HOST_PORT:-4000}:4000"
    environment:
      # SQLite 数据库文件路径（挂载到宿主机持久化）
      DB_PATH: /data/evacuation.db
      PORT: 4000
      # 数据库为空时是否写入示例方案：1 写入 / 0 不写入
      SEED_DEMO: "1"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
